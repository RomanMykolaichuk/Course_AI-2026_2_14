name: Primary Data Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/data_smoke.yml"
      - "src/ingestion/acquire_primary.py"
      - "src/preprocessing/primary_dataset.py"
      - "src/preprocessing/regions.py"
      - "src/db/connection.py"
      - "src/db/init_db.py"
      - "src/db/check_db.py"
      - "src/db/seed_regions.py"
      - "src/db/load_primary.py"
      - "src/db/queries.py"
      - "src/db/analytics_report.py"
      - "src/features/national_daily.py"
      - "src/features/quality_gate.py"
      - "src/features/split.py"
      - "src/features/target_diagnostics.py"
      - "src/models/historical_count_backtest.py"
      - "sql/schema.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primary-data-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-primary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal pipeline dependencies
        run: pip install pandas scikit-learn python-dotenv "kagglehub>=1.0,<2"

      - name: Acquire current public dataset
        run: python -m src.ingestion.acquire_primary --snapshot-date ci --force

      - name: Build SQLite from current snapshot
        run: |
          python -m src.db.load_primary \
            --snapshot-dir data/raw/piterfm_massive_missile_attacks/ci \
            --db /tmp/airstrikes-real.db > /tmp/primary-build-summary.json

      - name: Build retrospective analytics summary
        run: |
          python -m src.db.analytics_report \
            --db /tmp/airstrikes-real.db \
            --model-limit 10 \
            --region-limit 10 > /tmp/analytics-summary.json

      - name: Build leakage-safe national daily features
        run: |
          python -m src.features.national_daily \
            --db /tmp/airstrikes-real.db \
            --output-root /tmp/ml-features > /tmp/ml-feature-summary.json

      - name: Build chronological ML partitions
        run: |
          python -m src.features.split \
            --db /tmp/airstrikes-real.db \
            --output-dir /tmp/ml-splits > /tmp/ml-split-summary.json

      - name: Diagnose alternative historical targets
        run: |
          python -m src.features.target_diagnostics \
            --db /tmp/airstrikes-real.db > /tmp/ml-target-diagnostics.json

      - name: Evaluate ML quality gate
        run: |
          python -m src.features.quality_gate \
            --db /tmp/airstrikes-real.db > /tmp/ml-quality-gate.json

      - name: Run offline historical count backtest
        run: |
          python -m src.models.historical_count_backtest \
            --db /tmp/airstrikes-real.db \
            --output /tmp/ml-backtest.json

      - name: Show summaries
        run: |
          cat /tmp/primary-build-summary.json
          cat /tmp/analytics-summary.json
          cat /tmp/ml-feature-summary.json
          cat /tmp/ml-split-summary.json
          cat /tmp/ml-target-diagnostics.json
          cat /tmp/ml-quality-gate.json
          cat /tmp/ml-backtest.json

      - name: Upload summaries only
        uses: actions/upload-artifact@v4
        with:
          name: primary-build-summary
          path: |
            /tmp/primary-build-summary.json
            /tmp/analytics-summary.json
            /tmp/ml-feature-summary.json
            /tmp/ml-split-summary.json
            /tmp/ml-target-diagnostics.json
            /tmp/ml-quality-gate.json
            /tmp/ml-backtest.json
          retention-days: 7
