name: Primary Data Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/data_smoke.yml"
      - "src/ingestion/**"
      - "src/preprocessing/**"
      - "src/db/**"
      - "sql/schema.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-primary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal pipeline dependencies
        run: pip install pandas python-dotenv "kagglehub>=1.0,<2"

      - name: Acquire current public dataset
        run: python -m src.ingestion.acquire_primary --snapshot-date ci --force

      - name: Inspect affected_region representation
        run: |
          python - <<'PY'
          import pandas as pd
          path = "data/raw/piterfm_massive_missile_attacks/ci/missile_attacks_daily.csv"
          df = pd.read_csv(path)
          values = df["affected_region"].dropna().astype(str)
          values = values[values.str.strip().ne("")]
          print("affected_region_nonempty:", len(values))
          print("affected_region_unique:", values.nunique())
          print("affected_region_examples:")
          for value in values.drop_duplicates().head(20):
              print(repr(value))
          PY

      - name: Build SQLite from current snapshot
        run: |
          python -m src.db.load_primary             --snapshot-dir data/raw/piterfm_massive_missile_attacks/ci             --db /tmp/airstrikes-real.db > /tmp/primary-build-summary.json

      - name: Show build summary
        run: cat /tmp/primary-build-summary.json

      - name: Upload summary only
        uses: actions/upload-artifact@v4
        with:
          name: primary-build-summary
          path: /tmp/primary-build-summary.json
          retention-days: 7